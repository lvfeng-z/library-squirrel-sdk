syntax = "proto3";

package plugins;

option go_package = "github.com/lvfeng-z/library-squirrel-sdk/gen;gen";

// ========== 共享消息类型 ==========

message Empty {}

message Task {
  int64 id = 1;
  int64 createTime = 2;
  int64 updateTime = 3;
  optional bool hasChild = 4;
  optional int64 pid = 5;
  optional string taskName = 6;
  optional int64 siteId = 7;
  optional string siteWorkId = 8;
  optional string url = 9;
  int32 status = 10;
  reserved 11; // 已移除 pendingResourceId(任务执行面暂存模式改造,资源定位改由主程序按 task_id 直查,插件零消费)
  optional bool continuable = 12;
  optional string pluginPublicId = 13;
  optional string pluginExtensionId = 14;
  optional string pluginData = 15;
  optional string errorMessage = 16;
  repeated string involvedRoles = 17; // 任务涉及的 store_type 集合(创建期声明,universe);与主程序 TaskDTO 对齐,使 dto.TaskDTO 可作 gen.Task 别名
  string resourceType = 18;           // 任务产生的 resource 资源类型(预定义值);空=未声明
  optional string taskType = 19;      // 任务类型:空=插件任务;内置类型如 share-host/share-receive(主程序内置执行面,插件不产出)
}

message Work {
  int64 id = 1;
  int64 createTime = 2;
  int64 updateTime = 3;
  optional int64 siteId = 4;
  optional string siteWorkId = 5;
  optional string siteWorkName = 6;
  optional string siteAuthorId = 7;
  optional string siteWorkDescription = 8;
  optional int64 siteUploadTime = 9;
  optional int64 siteUpdateTime = 10;
  optional string nickName = 11;
  optional int64 localAuthorId = 12;
  optional int64 lastView = 13;
}

message WorkSet {
  int64 id = 1;
  int64 createTime = 2;
  int64 updateTime = 3;
  optional int64 siteId = 4;
  optional string siteWorkSetId = 5;
  optional string siteWorkSetName = 6;
  optional string siteAuthorId = 7;
  optional string siteWorkSetDescription = 8;
  optional int64 siteUploadTime = 9;
  optional int64 siteUpdateTime = 10;
  optional string nickName = 11;
  optional int64 lastView = 12;
  optional string description = 13; // 作品集描述;与主程序 WorkSetDTO 对齐,使 dto.WorkSetDTO 可作 gen.WorkSet 别名
}

message SiteDTO {
  int64 id = 1;
  optional string siteName = 2;
  reserved 3; // 已移除 siteDescription(站点描述全链退役)
  optional string homepage = 4;
  int64 createTime = 5;
  int64 updateTime = 6;
  string siteKey = 7; // 站点唯一身份键(identity 注册表分配);主程序侧必填校验,siteName 仅展示
}

message LocalAuthorDTO {
  int64 id = 1;
  optional string authorName = 2;
  optional string introduce = 3;
  optional int64 lastUse = 4;
  int64 createTime = 5;
  int64 updateTime = 6;
}

message LocalTagDTO {
  int64 id = 1;
  optional string localTagName = 2;
  optional int64 baseLocalTagId = 3;
  optional string description = 4;
  optional int64 lastUse = 5;
  int64 createTime = 6;
  int64 updateTime = 7;
}

message TaskSiteAuthorDTO {
  string siteAuthorId = 1;
  string authorName = 2;
  string homepage = 3;
  string fixedAuthorName = 4;
  string introduce = 5;
}

message TaskSiteTagDTO {
  string siteTagId = 1;
  string tagName = 2;
  string description = 3;
  string namespace = 4; // tag namespace（language/character/parody/female/male/misc/general 等）；空=无 namespace（pixiv 等无 namespace 站点）
}

message TaskWorkSetDTO {
  string siteWorkSetId = 1;
  string workSetName = 2;
}

message TaskCreateChildResponse {
  string taskName = 1;
  string siteWorkId = 2;
  string url = 3;
  string pluginData = 4;
  string siteName = 5;
  repeated string involvedRoles = 6; // 子任务涉及的 store_type 集合(创建期声明,universe);空=未确定
  string resourceType = 7; // 子任务产生的 resource 的资源类型(预定义 image/video/article/document/audio/unknown);空=未声明
}

message TaskCreateResponse {
  string pluginTaskId = 1;
  string taskName = 2;
  string siteWorkId = 3;
  string url = 4;
  string pluginData = 5;
  string siteName = 6;
  repeated TaskCreateChildResponse children = 7;
  repeated string involvedRoles = 8; // 任务涉及的 store_type 集合(创建期声明,universe);空=未确定
  string resourceType = 9; // 任务产生的 resource 的资源类型(预定义值);空=未声明;有 children 时由各 child 声明
  string siteKey = 10; // 站点唯一身份键(identity 注册表分配);主程序据此解析任务归属站点,siteName 仅展示
}

message WorkResponse {
  Work work = 1;
  SiteDTO site = 2;
  repeated LocalAuthorDTO localAuthors = 3;
  repeated LocalTagDTO localTags = 4;
  repeated TaskSiteAuthorDTO siteAuthors = 5;
  repeated TaskSiteTagDTO siteTags = 6;
  repeated TaskWorkSetDTO workSets = 7;
}

message TaskResParam {
  Task task = 1;
  int64 resourceId = 2;
  string resourcePath = 3;
  int64 downloadedBytes = 4;
}

// ========== 1. 插件生命周期服务（主程序 → 插件）==========

service PluginLifecycle {
  rpc Activate(ActivateRequest) returns (ActivateResponse);
  rpc Shutdown(Empty) returns (Empty);
}

message ActivateRequest {
  string pluginPublicId = 1;
  string pluginData = 2;
  string rootPath = 3;
  uint32 hostServiceId = 4;
  uint64 main_window_handle = 5;
}

message ActivateResponse {}

// ========== 2. 任务处理器服务（主程序 → 插件）==========

service TaskHandlerService {
  rpc Create(CreateRequest) returns (stream CreateChunk);
  rpc CreateWorkInfo(CreateWorkInfoRequest) returns (WorkResponse);
  rpc Start(stream StartFrame) returns (stream StreamChunk);
  rpc Retry(RetryRequest) returns (WorkResponse);
  rpc Pause(TaskResParamMessage) returns (Empty);
  rpc Stop(TaskResParamMessage) returns (Empty);
  rpc Resume(stream ResumeFrame) returns (stream StreamChunk);
  rpc QueryWorkSetOrder(QueryWorkSetOrderRequest) returns (QueryWorkSetOrderResponse);
  rpc QueryWorkSetRelations(QueryWorkSetRelationsRequest) returns (QueryWorkSetRelationsResponse);
}

// QueryWorkSetOrder 查询作品集内作品的原站顺序（主程序作品入库后拉取，仅写 site_sort_order，不碰本地序）
message QueryWorkSetOrderRequest {
  int64 site_id = 1;            // 站点内部 ID（主程序已知）
  string site_work_set_id = 2;  // 站点作品集 ID（插件原生 ID）
}

message QueryWorkSetOrderResponse {
  repeated WorkOrderEntry entries = 1;  // 集内全序；空=插件不掌握/不提供
}

message WorkOrderEntry {
  string siteWorkId = 1;  // 站点作品 ID
  int64 sortOrder = 2;     // 该作品在此集内的原站序号（从 0 起）
}

// QueryWorkSetRelations 查询本作品集的父集关系 + 在各父集下的原站序（主程序作品入库后拉取，仅写 site_sort_order，不碰本地序）
// 与 QueryWorkSetOrder 的区别：QueryWorkSetOrder 查「作品集内作品」的序；本 RPC 查「作品集的父集」关系 + 本集在各父下的序。
// 拉取方向选「成员→父集」而非「父集→成员」：父集（如 series）无 work 直接归属，只能经子集拉取发现。
message QueryWorkSetRelationsRequest {
  int64 site_id = 1;            // 站点内部 ID（主程序已知）
  string site_work_set_id = 2;  // 本作品集站点 ID（主程序已通过 WorkResponse.workSets 知其存在）
}

message QueryWorkSetRelationsResponse {
  repeated WorkSetRelationEntry parents = 1;  // 本集的父集 + 在各父集下的序；空=无父/插件不掌握
}

message WorkSetRelationEntry {
  string parentSiteWorkSetId = 1;  // 父作品集站点 ID
  string parentWorkSetName = 2;    // 父集名（父集首次入库时落库；series 标题由此带回）
  int64 sortOrder = 3;              // 本集在该父集下的原站序号（从 0 起）
}

message CreateRequest {
  string url = 1;
  string extensionId = 2;
}

// Create 流式响应块
message CreateChunk {
  oneof payload {
    CreateMode mode = 1;              // 首条消息：模式标记
    TaskCreateResponse task = 2;      // 后续消息：任务数据
    string error = 3;                 // 错误
  }
}

message CreateMode {
  bool is_stream = 1;                 // true=流式, false=批量
}

message CreateWorkInfoRequest {
  Task task = 1;
  string extensionId = 2;
}

message StartRequest {
  Task task = 1;
  string extensionId = 2;
  repeated string storeRoles = 3; // 本次执行所选 store_type 子集(空=全量);插件据此选择性产出
}

message RetryRequest {
  Task task = 1;
  string extensionId = 2;
}

message TaskResParamMessage {
  TaskResParam param = 1;
  string extensionId = 2;
}

// 续传参数(每条 downloaded store 独立偏移,按 role+store_seq 身份化)
message TaskResumeParam {
  Task task = 1;
  // 主程序磁盘暂存中全部未提交 downloaded 轨的已落盘偏移(可能已达该轨完整大小——多轨并发
  // 下小轨先写满、等待其余轨道写满一起提交是常态)。插件是站点与主程序间的兼容层,单轨完成
  // 状态的确认归插件职责:对每条偏移与来源侧比对,已写满(来源现值==偏移)→ 返回 Size=偏移、
  // 立即 EOF 流的 spec 或不返回该轨(空过,主程序经 Start 重产);来源现值与偏移不符(内容变更)
  // → 返回以来源现值为 Size 的完整流,主程序按声明大小截断整轨重下
  repeated StoreResumeOffset streamOffsets = 2;
  reserved 3; // 已移除 storeRoles(Resume 由 streamOffsets 控制)
}

// StoreResumeOffset 单条 downloaded store 的续传偏移(身份化:role+store_seq 唯一定位一个 store)
message StoreResumeOffset {
  string role = 1;     // store_type(image/document/videoTrack/audioTrack/...)
  int32 storeSeq = 2; // 同 role 内的 store 序号(单例为 0;N-同 role 多 store 各自 0..N-1)
  int64 offset = 3;    // 该 store 已写入字节数(磁盘 stat 为权威)
}

message TaskResumeParamMessage {
  TaskResumeParam param = 1;
  string extensionId = 2;
}

// 流式数据块
message StreamChunk {
  // data/eof/error 块的所属轨道(store_type);WorkResponse/Specs 块不设
  string role = 5;
  oneof payload {
    WorkResponse workResponse = 1;
    StoreSpecs specs = 6;
    bytes data = 2;
    bool eof = 3;
    string error = 4;
  }
}

// Start bidi 请求帧:首帧携带 StartRequest,后续帧按需拉取数据(PullRequest)
message StartFrame {
  oneof frame {
    StartRequest start = 1;
    PullRequest pull = 2;
  }
}

// Resume bidi 请求帧:首帧携带 TaskResumeParamMessage,后续帧按需拉取数据(PullRequest)
message ResumeFrame {
  oneof frame {
    TaskResumeParamMessage resume = 1;
    PullRequest pull = 2;
  }
}

// 主程序按需拉取:插件据 max_bytes 调对应 role reader.Read 一次,回一个 StreamChunk{role, data/eof/error}
message PullRequest {
  string role = 1;
  int32 max_bytes = 2;
}

// StoreSpec 可序列化元数据(不含 reader,reader 数据走 data 块)
message StoreSpecMeta {
  string role = 1;
  string generation = 2;
  string format = 3;
  int64 size = 4;
  string suggestName = 5;
  optional bool continuable = 6;
  optional int64 resumeWriteOffset = 7; // 续传写入偏移(仅 Resume);nil=信任主程序 offset
  string description = 8;               // 资源描述(多 store 命名可选拼段;空则省略描述段)
  optional string expectedSha256 = 9;   // 来源侧声明的期望哈希;主程序照单消费,不以本地计算替代声明源
}

// 产出声明集合(Start/Resume 首批,声明全部轨道元数据)
message StoreSpecs {
  repeated StoreSpecMeta items = 1;
}

// ========== 3. 站点浏览器服务（主程序 → 插件）==========

service SiteBrowserService {
  rpc Open(BrowserRequest) returns (Empty);
  rpc Close(BrowserRequest) returns (Empty);
}

message BrowserRequest {
  string extensionId = 1;
}

// ========== 4. 主程序宿主服务（插件 → 主程序，通过 GRPCBroker）==========

service HostService {
  // 扩展点注册
  rpc RegisterTaskHandler(RegisterExtensionRequest) returns (Empty);
  rpc RegisterSiteBrowser(RegisterExtensionRequest) returns (Empty);
  rpc UnregisterSiteBrowser(UnregisterRequest) returns (Empty);

  // 插件自存信息（统一 KV 存储，取代临时 plugin_data 与 secure_storage）
  rpc GetValue(StorageKeyRequest) returns (StorageValueResponse);
  rpc SetValue(StorageEntryRequest) returns (Empty);
  rpc SetValueEncrypted(StorageEntryRequest) returns (Empty);
  rpc DeleteValue(StorageKeyRequest) returns (Empty);
  rpc GetAllValues(Empty) returns (AllStorageValuesResponse);

  // 任务管理
  rpc RegisterUrlListener(UrlListenerRequest) returns (Empty);
  rpc UnregisterUrlListener(UnregisterRequest) returns (Empty);
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);

  // 路径
  rpc GetPluginRoot(GetPluginRootRequest) returns (GetPluginRootResponse);

  // 日志
  rpc Log(LogRequest) returns (Empty);

  // 前后端通信
  rpc PublishToFrontend(PublishToFrontendRequest) returns (Empty);
  rpc SubscribeFrontend(SubscribeFrontendRequest) returns (stream FrontendMessage);
  rpc UnsubscribeFrontend(UnsubscribeFrontendRequest) returns (Empty);
}

message RegisterExtensionRequest {
  string extensionId = 1;
  string name = 2;
  string description = 3;
}

message UnregisterRequest {
  string extensionId = 1;
}

message StorageKeyRequest {
  string key = 1;
}

// StorageValue 带配置 schema 版本的存储值，用作全量读取的 map 值类型
message StorageValue {
  string value = 1;
  int32 schema_version = 2;   // 该值写入时的插件配置 schema 版本（host 盖戳，详见主程序 configSchemaVersion）
}

message StorageValueResponse {
  string value = 1;
  int32 schema_version = 2;   // GetValue 单条返回的值对应的 schema 版本
}

message StorageEntryRequest {
  string key = 1;
  string value = 2;
}

message AllStorageValuesResponse {
  map<string, StorageValue> values = 1;   // 全量：key → 带版本的值
}

message UrlListenerRequest {
  string extensionId = 1;
  repeated string patterns = 2;
}

message CreateTaskRequest {
  string url = 1;
}

message CreateTaskResponse {
  bool succeed = 1;
  int32 addedQuantity = 2;
  string msg = 3;
}

message GetPluginRootRequest {
  bool isRelative = 1;
}

message GetPluginRootResponse {
  string path = 1;
}

message LogRequest {
  int32 level = 1;
  string template = 2;
  repeated string args = 3;
  string loggerName = 4;
}

// ========== 前后端通信消息类型 ==========

message PublishToFrontendRequest {
  string topic = 1;
  bytes data = 2;
}

message SubscribeFrontendRequest {
  string topic = 1;
}

message FrontendMessage {
  string topic = 1;
  bytes data = 2;
}

message UnsubscribeFrontendRequest {
  string topic = 1;
}

// ========== 5. 库查询服务（插件 → 主程序，通过 GRPCBroker）==========
// Tier 1 只读查询面：插件查询已在库的作品及周边数据（任务历史不在本面，任务域查询语义未稳定）。
// - 软删/活行：默认只返回活数据——软删作品/store 不出现在任何查询结果，resource_store 关联按活行过滤。
// - 身份键优先：跨库语义寻址一律 (site_key, 站点侧 id) 复合键；消息内各 int64 id 为库内行 id，作会话内
//   不透明句柄（与前端 bindings 暴露尺度一致）。
// - 分页载体：proto3 无泛型，无法定义泛型 PageResult；采用「请求侧共享 PageRequest 子消息 + 响应侧
//   typed items 字段 + 共享 PageInfo 回执」等价落地。无界集合查询（Query* 族）强制分页，不提供全量倾倒；
//   按归属锚定的完整关联（List*ByWorkId 族与作品集父子导航：语义即全集，体量由归属上界锚定）与站点
//   注册表投影（ListSites：站点键只增不改，个位数级）不分页。
// - Get* 族未命中返回 gRPC NotFound；GetWorkDir 未配置返回 FailedPrecondition（显式拒绝语义，
//   不返回空路径）。
service LibraryQuery {
  // 作品
  rpc GetWorkById(GetWorkByIdRequest) returns (WorkWithSite);
  rpc GetWorkBySiteKey(GetWorkBySiteKeyRequest) returns (WorkWithSite);
  rpc QueryWorks(QueryWorksRequest) returns (QueryWorksResponse);

  // 资源与 store
  rpc ListResourcesByWorkId(ListResourcesByWorkIdRequest) returns (ListResourcesByWorkIdResponse);

  // 作者（本地轨 / 站点轨 / 作品关联）
  rpc GetLocalAuthorById(GetLocalAuthorByIdRequest) returns (LocalAuthorDTO);
  rpc QueryLocalAuthors(QueryLocalAuthorsRequest) returns (QueryLocalAuthorsResponse);
  rpc GetSiteAuthorBySiteKey(GetSiteAuthorBySiteKeyRequest) returns (SiteAuthorInfo);
  rpc QuerySiteAuthors(QuerySiteAuthorsRequest) returns (QuerySiteAuthorsResponse);
  rpc ListAuthorsByWorkId(ListAuthorsByWorkIdRequest) returns (ListAuthorsByWorkIdResponse);

  // 标签（与作者对称；作品关联含关联级 namespace 维度）
  rpc GetLocalTagById(GetLocalTagByIdRequest) returns (LocalTagDTO);
  rpc QueryLocalTags(QueryLocalTagsRequest) returns (QueryLocalTagsResponse);
  rpc GetSiteTagBySiteKey(GetSiteTagBySiteKeyRequest) returns (SiteTagInfo);
  rpc QuerySiteTags(QuerySiteTagsRequest) returns (QuerySiteTagsResponse);
  rpc ListTagsByWorkId(ListTagsByWorkIdRequest) returns (ListTagsByWorkIdResponse);

  // 作品集
  rpc GetWorkSetById(GetWorkSetByIdRequest) returns (WorkSet);
  rpc GetWorkSetBySiteKey(GetWorkSetBySiteKeyRequest) returns (WorkSet);
  rpc ListWorkSetsByWorkId(ListWorkSetsByWorkIdRequest) returns (ListWorkSetsByWorkIdResponse);
  rpc ListParentWorkSets(ListParentWorkSetsRequest) returns (ListParentWorkSetsResponse);
  rpc ListChildWorkSets(ListChildWorkSetsRequest) returns (ListChildWorkSetsResponse);

  // 站点（注册表投影，只读）
  rpc ListSites(Empty) returns (ListSitesResponse);

  // 工作目录
  rpc GetWorkDir(Empty) returns (GetWorkDirResponse);
}

// PageRequest 无界集合查询（Query* 族）的公共分页参数
message PageRequest {
  int32 page = 1;      // 页码，从 1 起（与主程序仓储分页一致）；<=0 按 1 处理
  int32 page_size = 2; // 每页条数；<=0 按服务端默认值处理；上限指导值见插件开发指南（宿主数据库单连接，重查询需节制）
}

// PageInfo 分页回执：过滤后总数 + 实际生效的页码/页大小
message PageInfo {
  int64 total = 1;     // 过滤后总条数（不含分页截断）
  int32 page = 2;      // 实际生效页码
  int32 page_size = 3; // 实际生效页大小
}

message GetWorkByIdRequest {
  int64 work_id = 1; // 库内作品行 id
}

message GetWorkBySiteKeyRequest {
  string site_key = 1;     // 站点身份键（identity 注册表分配的品牌 slug）
  string site_work_id = 2; // 站点侧作品 id
}

// WorkWithSite 作品 + 归属站点并排组合：Work 只带库内 site_id，复合身份键 (site_key, site_work_id) 经 SiteDTO 补全
message WorkWithSite {
  Work work = 1;
  SiteDTO site = 2;
}

message QueryWorksRequest {
  string site_key = 1;         // 站点身份键过滤（精确）；空=全部站点
  string name_keyword = 2;     // 作品名模糊匹配（site_work_name）；空=不过滤
  string author_keyword = 3;   // 作者名过滤（本地或站点作者名命中即匹配）；空=不过滤
  string tag_keyword = 4;      // 标签名过滤（本地或站点标签名命中即匹配）；空=不过滤
  int64 create_time_start = 5; // 入库时间范围下界（毫秒时间戳，含）；0=不限
  int64 create_time_end = 6;   // 入库时间范围上界（毫秒时间戳，含）；0=不限
  PageRequest page = 7;
}

message QueryWorksResponse {
  repeated WorkWithSite items = 1;
  PageInfo page = 2;
}

message ListResourcesByWorkIdRequest {
  int64 work_id = 1;
}

message ListResourcesByWorkIdResponse {
  repeated ResourceInfo items = 1;
}

// ResourceInfo 资源摘要（含活行 store 摘要列表）
message ResourceInfo {
  int64 id = 1;
  int64 task_id = 2;                // 产生本资源的任务 id（溯源）；0=非任务产（本地导入等）
  optional string suggest_name = 3; // 资源建议名（多 store 命名可选拼段的基名）；空=未命名
  string resource_type = 4;         // 资源类型（内置 image/video/article/document/audio/unknown 或插件自定义类型）
  int32 resource_complete = 5;      // 资源完整度百分比（0-100）
  repeated StoreInfo stores = 6;    // 活行 store 摘要（软删/失效关联不出现）
  int64 create_time = 7;
  int64 update_time = 8;
}

// StoreInfo 单个活行 store 的文件摘要
message StoreInfo {
  string role = 1;               // store_type 业务角色（image/document/thumbnail/videoTrack/audioTrack/videoMain/audioMain）
  int32 store_seq = 2;           // 同 role 内序号（单例为 0）
  optional string file_path = 3; // 库内相对路径（relPath 域，分隔符恒为正斜杠，与库内存储一致；拼 OS 路径由消费方自理）；行未落文件时缺省
  optional string format = 4;    // 文件扩展名（不含点）；无扩展名时缺省
  optional int64 size = 5;       // 文件字节数（磁盘实况）；文件缺失/不可读时缺省
  optional int32 width = 6;      // 图像像素宽；非图像资源缺省
  optional int32 height = 7;     // 图像像素高；非图像资源缺省
  int64 completed_at = 8;        // 落盘完成时刻（毫秒时间戳；0=未完成）
}

message GetLocalAuthorByIdRequest {
  int64 local_author_id = 1;
}

message QueryLocalAuthorsRequest {
  string name_keyword = 1; // 本地作者名模糊匹配；空=不过滤
  PageRequest page = 2;
}

message QueryLocalAuthorsResponse {
  repeated LocalAuthorDTO items = 1;
  PageInfo page = 2;
}

message GetSiteAuthorBySiteKeyRequest {
  string site_key = 1;
  string site_author_id = 2; // 站点侧作者 id
}

// SiteAuthorInfo 站点作者查询结果：字段面对齐任务声明期 TaskSiteAuthorDTO，另携库内行 id 与身份键锚点
message SiteAuthorInfo {
  int64 id = 1;                        // 库内 site_author 行 id
  string site_key = 2;                 // 归属站点身份键
  string site_author_id = 3;           // 站点侧作者 id
  string author_name = 4;
  string homepage = 5;
  string fixed_author_name = 6;
  string introduce = 7;
  optional int64 local_author_id = 8;  // 用户桥接的本地作者 id（跨站聚合锚点）；未桥接时缺省
}

message QuerySiteAuthorsRequest {
  string site_key = 1;     // 站点身份键过滤（精确）；空=全部站点
  string name_keyword = 2; // 作者名模糊匹配；空=不过滤
  PageRequest page = 3;
}

message QuerySiteAuthorsResponse {
  repeated SiteAuthorInfo items = 1;
  PageInfo page = 2;
}

message ListAuthorsByWorkIdRequest {
  int64 work_id = 1;
}

message ListAuthorsByWorkIdResponse {
  repeated LocalAuthorDTO local_authors = 1; // 本地轨（用户策展关联）
  repeated SiteAuthorInfo site_authors = 2;  // 站点轨（站点来源关联）
}

message GetLocalTagByIdRequest {
  int64 local_tag_id = 1;
}

message QueryLocalTagsRequest {
  string name_keyword = 1; // 本地标签名模糊匹配；空=不过滤
  PageRequest page = 2;
}

message QueryLocalTagsResponse {
  repeated LocalTagDTO items = 1;
  PageInfo page = 2;
}

message GetSiteTagBySiteKeyRequest {
  string site_key = 1;
  string site_tag_id = 2; // 站点侧标签 id
}

// SiteTagInfo 站点标签查询结果：字段面对齐任务声明期 TaskSiteTagDTO，另携库内行 id 与身份键锚点
message SiteTagInfo {
  int64 id = 1;                   // 库内 site_tag 行 id
  string site_key = 2;            // 归属站点身份键
  string site_tag_id = 3;         // 站点侧标签 id
  string tag_name = 4;
  string description = 5;
  string namespace = 6;           // 站点侧 namespace（language/character/parody/female/male/misc/general 等）；空=站点无 namespace
  optional int64 local_tag_id = 7; // 用户桥接的本地标签 id；未桥接时缺省
}

message QuerySiteTagsRequest {
  string site_key = 1;     // 站点身份键过滤（精确）；空=全部站点
  string name_keyword = 2; // 标签名模糊匹配；空=不过滤
  PageRequest page = 3;
}

message QuerySiteTagsResponse {
  repeated SiteTagInfo items = 1;
  PageInfo page = 2;
}

message ListTagsByWorkIdRequest {
  int64 work_id = 1;
}

// WorkLocalTagEntry 作品的本地标签关联条目（标签 + 关联级 namespace）
message WorkLocalTagEntry {
  LocalTagDTO tag = 1;
  string namespace = 2; // 关联级 namespace（用户自设）；空=无
}

// WorkSiteTagEntry 作品的站点标签关联条目（标签 + 关联级 namespace）
message WorkSiteTagEntry {
  SiteTagInfo tag = 1;
  string namespace = 2; // 关联级 namespace（所指 site_tag.namespace 在本关联上的镜像）；空=无
}

message ListTagsByWorkIdResponse {
  repeated WorkLocalTagEntry local_tags = 1;
  repeated WorkSiteTagEntry site_tags = 2;
}

message GetWorkSetByIdRequest {
  int64 work_set_id = 1; // 库内作品集行 id
}

message GetWorkSetBySiteKeyRequest {
  string site_key = 1;
  string site_work_set_id = 2; // 站点侧作品集 id
}

message ListWorkSetsByWorkIdRequest {
  int64 work_id = 1;
}

message ListWorkSetsByWorkIdResponse {
  repeated WorkSet items = 1;
}

message ListParentWorkSetsRequest {
  int64 work_set_id = 1; // 库内作品集行 id（可由 GetWorkSetBySiteKey / ListWorkSetsByWorkId 结果取得）
}

message ListParentWorkSetsResponse {
  repeated WorkSet items = 1;
}

message ListChildWorkSetsRequest {
  int64 work_set_id = 1;
}

message ListChildWorkSetsResponse {
  repeated WorkSet items = 1;
}

message ListSitesResponse {
  repeated SiteDTO items = 1; // 注册表投影全集
}

message GetWorkDirResponse {
  string path = 1; // 资源库根目录绝对路径（OS 原生分隔符，absPath 域）。未配置时本 RPC 返回 FailedPrecondition 错误（显式拒绝，不返回空路径）
}
